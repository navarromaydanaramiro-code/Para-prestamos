<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345a">
<title>PreEvaluación de Préstamos</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172334;background:#f3f6fa}
*{box-sizing:border-box}
body{margin:0}
header{background:#12345a;color:#fff;padding:22px 18px}
header h1{font-size:22px;margin:0 0 5px}
header p{margin:0;color:#d8e5f4;font-size:14px}
main{max-width:850px;margin:18px auto;padding:0 14px 36px}
.card{background:#fff;border:1px solid #dce4ed;border-radius:15px;padding:17px;margin:13px 0;box-shadow:0 2px 8px #142b4510}
h2{font-size:17px;margin:0 0 13px;color:#12345a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:11px;font:inherit;background:#fff;color:#172334}
input[type=file]{padding:9px;background:#f8fafc}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;font-size:14px;cursor:pointer}
.primary{background:#145da0;color:#fff}
.secondary{background:#e8eef5;color:#17324f}
button:disabled{opacity:.6;cursor:wait}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.muted{font-size:12px;color:#617184;line-height:1.45}
.status{padding:10px;border-radius:9px;background:#eef5fc;font-size:13px;white-space:pre-wrap;margin-top:10px}
.decision{padding:16px;border-radius:12px;text-align:center;font-size:24px;font-weight:850;margin:14px 0}
.decision-yes{background:#e8f6eb;border:2px solid #38834b;color:#206131}
.decision-no{background:#fff0f0;border:2px solid #a12626;color:#8a1d1d}
.summary{font-size:14px;line-height:1.7;text-align:center;color:#172334}
.bcra-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.bcra-table th,.bcra-table td{padding:8px;border-bottom:1px solid #dce4ed;text-align:left;vertical-align:top}
.bcra-table th{background:#eef5fc;color:#12345a}
.bcra-card{overflow-x:auto}
.situation{display:inline-block;padding:3px 7px;border-radius:10px;background:#eef5fc;font-weight:700}
.summary strong{font-size:16px}
footer{text-align:center;color:#6b7787;font-size:12px;padding:10px}
@media(max-width:480px){
  header{padding:19px 15px}
  .card{padding:14px}
  .actions button{flex:1}
}
</style>

<script src="[https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js](https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js)"></script>
<script src="[https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js](https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js)"></script>
</head>

<body>
<header>
  <h1>PreEvaluación de Préstamos</h1>
  <p>Lectura de recibo y movimientos para orientar la carga del caso</p>
</header>

<main>
  <section class="card">
    <h2>1. Datos del cliente</h2>
    <div class="grid">
      <div>
        <label for="name">Apellido y nombre</label>
        <input id="name" placeholder="Se intenta completar desde el recibo">
      </div>
      <div>
        <label for="cuil">CUIL</label>
        <input id="cuil" inputmode="numeric" placeholder="Se intenta completar desde el recibo">
      </div>
      <div>
        <label for="kind">Tipo de cliente</label>
        <select id="kind">
          <option value="" selected>No detectado / revisar</option>
          <option>Empleado público</option>
          <option>Empleado privado</option>
          <option>Jubilado ANSES</option>
          <option>Pensionado ANSES</option>
          <option>Jubilado IPS</option>
          <option>Monotributista</option>
          <option>Otro / a revisar</option>
        </select>
      </div>
      <div>
        <label for="period">Período de documentación</label>
        <input id="period" placeholder="Se intenta completar desde el recibo">
      </div>
    </div>
  </section>

  <section class="card">
    <h2>2. Cargar documentación</h2>

    <label for="receipt">Recibo de sueldo / comprobante de ingresos (PDF, JPG o PNG)</label>
    <input id="receipt" type="file" accept=".pdf,image/*">

    <label for="bank">Últimos movimientos bancarios (podés elegir varios archivos)</label>
    <input id="bank" type="file" accept=".pdf,image/*" multiple>

    <div class="grid" style="margin-top:12px">
      <div>
